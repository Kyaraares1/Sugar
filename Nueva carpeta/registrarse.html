
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Coffee & Games - Registrarse</title>
    <link rel="stylesheet" href="pagina.css">
</head>

<body>
    <section class="Encabezado">
        <header>
            <div class="Marca">
                <div class="Sugar"> Sugar </div>
                <div class="CoffeeGames"> Coffee & Games </div>
            </div>
        </header>
    </section>

    <main id="registro" class="ListaDeJuegos">

        <div class="introduccion">
            <h2>Crear una cuenta</h2>
            <p>Unite para disfrutar de beneficios, reservas y sorpresas dulces.</p>
        </div>

    
        <section class="categoria">
            <form class="formulario-registro">
                
                <div class="campo-form">
                    <label for="nombre">Nombre y apellido</label>
                    <input type="text" id="nombre" placeholder="Ej: María Pérez" required>
                </div>

                <div class="campo-form">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="campo-form">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="campo-form">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Repetí tu contraseña" required>
                </div>

                <button type="submit" class="btn-enviar">Registrarse</button>

            </form>
        </section>

        <div class="volver">
            <a href="index.html">← Volver al inicio</a>
        </div>

    </main>

    <footer id="inicio" class="pie-pagina">
        <h4>Sugar Coffee & Games</h4>
        <p>El lugar donde los sabores y la diversión se encuentran.</p>
    </footer>

</body>
</html>
